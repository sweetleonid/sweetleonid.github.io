<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111412">
    <meta name="description" content="Бобровский Феномен —  новостная хроника города Боброво.">
    <title>Бобровский Феномен — новости Боброво</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fiction-bar">
        <div class="container fiction-bar-inner">
            <span class="fiction-dot" aria-hidden="true"></span>
            ХРОНИКА
            <span class="fiction-date">Редакционный выпуск</span>
        </div>
    </div>

    <header class="site-header">
        <div class="container">
            <div class="masthead">
                <a class="brand" href="#" data-page="home" aria-label="Бобровский Феномен — на главную">
                    <span class="brand-mark" aria-hidden="true">БФ</span>
                    <span class="brand-copy">
                        <span class="brand-name">Бобровский Феномен</span>
                        <span class="brand-tagline">Хроника Боброво</span>
                    </span>
                </a>
                <div class="header-note">
                    <span class="header-note-label">ГОРОДСКАЯ РЕДАКЦИЯ</span>
                    <span>Боброво </span>
                </div>
            </div>
            <nav class="main-nav" aria-label="Главная навигация">
                <button type="button" class="nav-link active" data-category="all" aria-pressed="true">Главное</button>
                <div class="category-nav" id="category-nav"></div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="home-page" class="page active">



            <section class="latest-section">
                <div class="section-heading">
                    <div>
                        <div class="section-kicker"><span></span> ГОРОДСКАЯ ХРОНИКА</div>
                        <h2>Все события</h2>
                    </div>
                    
                </div>
                <div class="articles-grid" id="articles-grid"></div>
            </section>
        </section>

        <section id="article-page" class="page">
            <button class="back-btn" data-page="home">← К городской хронике</button>
            <article class="article-full" id="article-full"></article>
        </section>

    </main>

    <footer>
        <div class="container footer-inner">
            <a class="footer-brand" href="#" data-page="home">Бобровский Феномен</a>
            
            <span>© 2026 · БФ</span>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
